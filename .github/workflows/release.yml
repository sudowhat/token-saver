name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use current npm
        run: npm install --global npm@latest

      - name: Validate tag and package version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          test "$VERSION" = "$TAG" || {
            echo "package.json version $VERSION does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          }

      - name: Test package
        run: |
          npm test
          npm pack --dry-run

      - name: Build release archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          PACK_FILE="$(npm pack --silent)"
          mv "$PACK_FILE" token-saver.tgz
          sha256sum token-saver.tgz > token-saver.tgz.sha256

      - name: Check whether npm version already exists
        id: npm_version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@sudowhat/token-saver@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm with provenance
        if: steps.npm_version.outputs.exists != 'true'
        run: npm publish --access public --provenance

      - name: Build release notes from changelog
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {found=1}
            found && /^## \[/ && $0 !~ "^## \\[" v "\\]" {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || printf 'Token Saver %s\n' "$VERSION" > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            token-saver.tgz \
            token-saver.tgz.sha256 \
            --verify-tag \
            --title "Token Saver $GITHUB_REF_NAME" \
            --notes-file release-notes.md
